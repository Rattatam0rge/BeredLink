# Starter hele BeredLink (web + MariaDB) med én kommando:  docker compose up --build
# Alle verdier har standardverdier, så det fungerer uten .env. Kopier .env.example til .env for å endre dem.
name: feedbackmap

services:
  db:
    image: mariadb:11.4
    container_name: feedbackmap-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_password}
      MARIADB_DATABASE: ${DB_NAME:-feedbackmap}
      MARIADB_USER: ${DB_USER:-feedbackmap}
      MARIADB_PASSWORD: ${DB_PASSWORD:-feedbackmap_dev_password}
    ports:
      - "${DB_PORT:-3307}:3306"   # valgfritt: for å se i databasen med f.eks. HeidiSQL
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feedbackmap-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${DB_NAME:-feedbackmap};User=${DB_USER:-feedbackmap};Password=${DB_PASSWORD:-feedbackmap_dev_password}"
      RunMigrationsOnStartup: "true"
      Storage__UploadsPath: /app/uploads
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads     # opplastede bilder av ressurser

volumes:
  db_data:
  uploads_data:
